<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="utf-8">

<title>RONIN-OFFICIAL ／ PROJECT RONIN</title>
<style>
  :root{ --bg:#120808; --ink:#d6d0cc; --dim:#8a827e; --faint:#5a5250; --red:#c42c28; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
  body{ display:flex; align-items:center; justify-content:center; padding:32px; }
  body::after{ content:""; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); }
  .wrap{ width:100%; max-width:760px; position:relative; z-index:1; }
  .top{ display:flex; align-items:flex-start; gap:14px; }
  .bar{ width:8px; height:74px; background:var(--red); }
  h1{ margin:0; font-size:44px; letter-spacing:.06em; color:#f0ece8; }
  .sub{ margin:6px 0 0; font-size:15px; color:var(--dim); letter-spacing:.16em; }
  .rule{ height:1px; background:#3a1e1a; margin:26px 0 24px; }
  .links{ display:grid; gap:12px; }
  a.item{ display:flex; align-items:baseline; justify-content:space-between; gap:16px;
    text-decoration:none; color:var(--ink); border:1px solid #3a1e1a; background:#170b0a;
    padding:16px 18px; transition:.16s; }
  a.item:hover{ border-color:var(--red); background:#1d0d0b; transform:translateY(-1px); }
  .name{ font-size:19px; letter-spacing:.04em; }
  .name small{ display:block; margin-top:4px; font-size:12px; color:var(--faint);
    letter-spacing:.1em; font-weight:400; }
  .go{ font-family:Consolas,monospace; font-size:12px; color:var(--red); letter-spacing:.1em; }
  .foot{ margin-top:28px; display:flex; justify-content:space-between; gap:16px;
    font-family:Consolas,monospace; font-size:11px; color:var(--faint); letter-spacing:.08em; }
  /* 背景车图：把 86.jpg 放在同目录即可，没有图也不会破版 */
  body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:url("86.jpg") center 70%/cover no-repeat;
    opacity:.16; filter:grayscale(35%) contrast(1.05);
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 38%, #000 100%);
    mask-image:linear-gradient(180deg, transparent 0%, #000 38%, #000 100%); }
  @media (max-width:520px){
    h1{ font-size:32px; } .bar{ height:58px; } .name{ font-size:17px; }
    .foot{ flex-direction:column; gap:6px; }
  }
</style>
</head>
